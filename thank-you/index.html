<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Inquiry Received | Sweet Elevation Bakery</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf3ea;
      --cream-deep: #f4ead9;
      --navy: #1f2950;
      --peach-deep: #e89f80;
      --ink-soft: #5a5b73;
      --line: #e8dfd0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--cream);
      color: var(--navy);
      font-family: 'Inter', sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 18px;
    }

    .confirmation {
      width: min(540px, 100%);
      text-align: center;
      padding: 34px 30px 30px;
      background: rgba(244, 234, 217, 0.72);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 12px 34px rgba(31, 41, 80, 0.06);
    }

    .logo {
      display: block;
      width: min(165px, 58%);
      height: auto;
      margin: 0 auto 16px;
    }

    .script {
      display: inline-block;
      margin-bottom: 2px;
      font-family: 'Caveat', cursive;
      font-size: 27px;
      font-weight: 600;
      color: var(--peach-deep);
      transform: rotate(-2deg);
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(36px, 7vw, 48px);
      font-weight: 400;
      line-height: 1.03;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    h1 em {
      color: var(--peach-deep);
      font-weight: 400;
    }

    .intro {
      max-width: 445px;
      margin: 0 auto;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 22px;
    }

    .primary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 43px;
      padding: 11px 23px;
      border-radius: 999px;
      background: var(--navy);
      color: var(--cream);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .primary-link:hover {
      background: var(--peach-deep);
      transform: translateY(-1px);
    }

    .text-link {
      color: var(--navy);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(31, 41, 80, 0.3);
      padding-bottom: 2px;
    }

    .text-link:hover { color: var(--peach-deep); }

    .contact {
      margin-top: 20px;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.5;
    }

    .contact a {
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
    }



    /* ─── One-time celebration animation ─── */
    .sprinkle-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .sprinkle {
      position: absolute;
      top: -28px;
      width: 5px;
      height: 15px;
      border-radius: 999px;
      opacity: 0;
      animation: sprinkleFall var(--fall-time, 2.7s) cubic-bezier(.2,.72,.35,1) var(--delay, 0s) forwards;
      transform: rotate(var(--start-rotate, 0deg));
    }

    .confirmation {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(16px) scale(0.985);
      animation: cardEnter 0.7s cubic-bezier(.2,.8,.25,1) 0.12s forwards;
    }

    .logo,
    .script,
    h1,
    .intro,
    .actions,
    .contact {
      opacity: 0;
      transform: translateY(9px);
      animation: contentEnter 0.55s ease forwards;
    }

    .logo { animation-delay: 0.28s; }
    .script { animation-delay: 0.38s; }
    h1 { animation-delay: 0.46s; }
    .intro { animation-delay: 0.54s; }
    .actions { animation-delay: 0.64s; }
    .contact { animation-delay: 0.74s; }

    @keyframes cardEnter {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes contentEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes sprinkleFall {
      0% {
        opacity: 0;
        transform: translate3d(0, -18px, 0) rotate(var(--start-rotate, 0deg));
      }
      12% { opacity: 0.78; }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift, 20px), 112vh, 0) rotate(var(--end-rotate, 480deg));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sprinkle-layer { display: none; }
      .confirmation,
      .logo,
      .script,
      h1,
      .intro,
      .actions,
      .contact {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .confirmation { padding: 28px 20px 25px; }
      .logo { width: 145px; margin-bottom: 13px; }
      .script { font-size: 25px; }
      h1 { font-size: 37px; }
      .actions { gap: 13px; margin-top: 20px; }
    }
  </style>
</head>
<body>
  <div class="sprinkle-layer" id="sprinkle-layer" aria-hidden="true"></div>

  <main class="confirmation">
    <a href="/" aria-label="Sweet Elevation Bakery home">
      <img class="logo" src="/assets/logo.png" alt="Sweet Elevation Bakery">
    </a>

    <div class="script">thank you!</div>
    <h1>Your inquiry is <em>on its way.</em></h1>

    <p class="intro">
      We received your wedding or event request and will respond within two to three business days.
    </p>

    <div class="actions">
      <a class="primary-link" href="/">Return Home</a>
      <a class="text-link" href="/portfolio/">View Portfolio</a>
    </div>

    <p class="contact">
      Need to modify something? Email us at <a href="mailto:sweetelevationbakery@gmail.com">sweetelevationbakery@gmail.com</a>.
    </p>
  </main>

  <script>
    (() => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const layer = document.getElementById('sprinkle-layer');
      const colors = ['#1f2950', '#e89f80', '#f4c4ad', '#5a5b73'];
      const count = window.innerWidth < 520 ? 14 : 22;

      for (let i = 0; i < count; i += 1) {
        const sprinkle = document.createElement('span');
        sprinkle.className = 'sprinkle';
        sprinkle.style.left = `${Math.random() * 100}%`;
        sprinkle.style.background = colors[Math.floor(Math.random() * colors.length)];
        sprinkle.style.setProperty('--delay', `${(Math.random() * 0.65).toFixed(2)}s`);
        sprinkle.style.setProperty('--fall-time', `${(2.15 + Math.random() * 1.15).toFixed(2)}s`);
        sprinkle.style.setProperty('--drift', `${(-55 + Math.random() * 110).toFixed(0)}px`);
        sprinkle.style.setProperty('--start-rotate', `${Math.floor(Math.random() * 180)}deg`);
        sprinkle.style.setProperty('--end-rotate', `${360 + Math.floor(Math.random() * 420)}deg`);
        sprinkle.style.width = `${4 + Math.random() * 3}px`;
        sprinkle.style.height = `${10 + Math.random() * 8}px`;
        layer.appendChild(sprinkle);
      }

      window.setTimeout(() => layer.remove(), 4200);
    })();
  </script>

</body>
</html>
