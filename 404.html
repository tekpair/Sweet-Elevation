<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Sweet Elevation Bakery</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf3ea;
    --navy: #1f2950;
    --peach: #f4c4ad;
    --peach-deep: #e89f80;
    --ink-soft: #5a5b73;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--navy);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 560px; }
  .script {
    font-family: 'Caveat', cursive;
    font-size: 32px;
    color: var(--peach-deep);
    margin-bottom: 4px;
    transform: rotate(-2deg);
    display: inline-block;
    font-weight: 600;
  }
  .num {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(120px, 18vw, 180px);
    line-height: 1;
    color: var(--navy);
    margin-bottom: 8px;
    letter-spacing: -0.04em;
  }
  .num em {
    font-style: italic;
    color: var(--peach-deep);
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 4vw, 42px);
    color: var(--navy);
    margin-bottom: 16px;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  h1 em {
    font-style: italic;
    color: var(--peach-deep);
  }
  p {
    color: var(--ink-soft);
    margin-bottom: 36px;
    line-height: 1.65;
    font-size: 16px;
    max-width: 440px;
    margin-left: auto;
    margin-right: auto;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--navy);
    color: var(--cream);
    padding: 16px 30px;
    border-radius: 100px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }
  .btn:hover {
    background: var(--peach-deep);
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="script">whoops —</div>
    <div class="num">4<em>0</em>4</div>
    <h1>This page took a <em>sweet detour.</em></h1>
    <p>We couldn't find what you were looking for. Let's get you back on track.</p>
    <a href="/" class="btn">← Back to Home</a>
  </div>
</body>
</html>
